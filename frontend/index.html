<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Gilded Reel — Slot Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="cabinet">

  <div class="cabinet-header">
    <span class="crest">&#10022;</span>
    <h1>THE GILDED REEL</h1>
    <span class="crest">&#10022;</span>
  </div>
  <p class="tagline">No. 1 — Est. in Brass &amp; Emerald</p>

  <!-- DEPOSIT SCREEN -->
  <section id="deposit-screen" class="panel">
    <p class="panel-label">Insert Funds</p>
    <div class="field-row">
      <span class="field-prefix">$</span>
      <input type="number" id="deposit-input" min="1" placeholder="0" autocomplete="off">
    </div>
    <button id="deposit-btn" class="btn btn-primary">Deposit &amp; Play</button>
    <p id="deposit-error" class="error-text"></p>
  </section>

  <!-- GAME SCREEN -->
  <section id="game-screen" class="panel hidden">

    <div class="readouts">
      <div class="odometer-block">
        <span class="odometer-label">Balance</span>
        <div class="odometer" id="balance-odometer"></div>
      </div>
      <div class="odometer-block">
        <span class="odometer-label">Last Win</span>
        <div class="odometer win-odometer" id="win-odometer"></div>
      </div>
    </div>

    <div class="reel-frame">
      <div class="reel-frame-inner">
        <div class="payline payline-1" data-line="1"></div>
        <div class="payline payline-2" data-line="2"></div>
        <div class="payline payline-3" data-line="3"></div>
        <div class="reels" id="reels">
          <!-- 3 columns x strip generated by JS -->
        </div>
      </div>
      <div class="rivet rivet-tl"></div>
      <div class="rivet rivet-tr"></div>
      <div class="rivet rivet-bl"></div>
      <div class="rivet rivet-br"></div>
    </div>

    <p id="result-message" class="result-message" aria-live="polite">Place your bet and pull the lever.</p>

    <div class="controls">
      <div class="control-group">
        <label for="lines-select">Lines</label>
        <div class="stepper">
          <button type="button" class="step-btn" data-target="lines" data-dir="-1">&minus;</button>
          <span id="lines-value" class="stepper-value">1</span>
          <button type="button" class="step-btn" data-target="lines" data-dir="1">&plus;</button>
        </div>
      </div>

      <div class="control-group">
        <label for="bet-select">Bet / Line</label>
        <div class="stepper">
          <button type="button" class="step-btn" data-target="bet" data-dir="-1">&minus;</button>
          <span id="bet-value" class="stepper-value">1</span>
          <button type="button" class="step-btn" data-target="bet" data-dir="1">&plus;</button>
        </div>
      </div>

      <div class="control-group total-bet-group">
        <label>Total Bet</label>
        <span id="total-bet-value" class="total-bet-value">$1</span>
      </div>
    </div>

    <p id="spin-error" class="error-text"></p>

    <div class="lever-row">
      <button id="spin-btn" class="btn btn-lever">
        <span class="lever-label">PULL</span>
      </button>
      <button id="cashout-btn" class="btn btn-secondary">Cash Out</button>
    </div>

    <p class="symbol-key">
      <span><i class="chip chip-a"></i> A &times;5</span>
      <span><i class="chip chip-b"></i> B &times;4</span>
      <span><i class="chip chip-c"></i> C &times;3</span>
      <span><i class="chip chip-d"></i> D &times;2</span>
    </p>
  </section>

  <!-- GAME OVER SCREEN -->
  <section id="over-screen" class="panel hidden">
    <p class="panel-label">You Walked Away With</p>
    <div class="odometer" id="final-odometer"></div>
    <button id="play-again-btn" class="btn btn-primary">Play Again</button>
  </section>

</div>

<div id="confetti-layer" aria-hidden="true"></div>

<script src="js/script.js"></script>
</body>
</html>
